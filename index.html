:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow column. Title, status + mode switch, square grass board (canvas), hint line, controls, lost pieces, character cards. */
:root{
  --bg:#E7EEDD; --panel:#F5F8EF; --fg:#1D2A1B; --muted:#58684F; --line:#C8D6BA;
  --accent:#E3A21A; --accent-ink:#2A1B02; --danger:#C93B28;
  --sun:#F2C94C; --night:#5560D6;

  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111911; --panel:#1A251A; --fg:#E7F0E1; --muted:#9DB097; --line:#2C3C2A;
    --accent:#F0B53C; --accent-ink:#241700; --danger:#FF8570; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111911; --panel:#1A251A; --fg:#E7F0E1; --muted:#9DB097; --line:#2C3C2A;
  --accent:#F0B53C; --accent-ink:#241700; --danger:#FF8570; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:18px 32px}
.app{max-width:560px;margin-inline:auto;display:grid;gap:14px}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(1.4rem,6vw,1.9rem);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--font-display);font-weight:700;font-size:1rem;margin:6px 0 10px}
.sub{margin:6px 0 0;color:var(--muted);text-wrap:pretty}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.turn{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0}
.dot{width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--fg);flex:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-weight:700;font-size:.9rem;padding:8px 14px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative}
canvas#cv{display:block;width:100%;height:auto;border-radius:14px;touch-action:manipulation;box-shadow:0 6px 18px rgba(20,40,10,.25);user-select:none;-webkit-user-select:none}
.result{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);color:var(--fg);border:2px solid var(--fg);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.result div{display:grid;min-width:0}
.result strong{font-family:var(--font-display);font-size:1rem}
.result span{color:var(--muted);font-size:.85rem}
.btn{border:2px solid var(--fg);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;flex:none}
.btn.ghost{background:transparent;color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.hint{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:4.4em}
.hint b{font-family:var(--font-display);font-size:.92rem}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.lost{display:grid;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;min-height:34px}
.lrow .tag{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted);width:92px;flex:none}
.lrow .tag i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--fg);display:inline-block}
.lrow .items{display:flex;flex-wrap:wrap;gap:2px;min-width:0}
.lrow .none{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ico{width:64px;height:64px;border-radius:12px;background:radial-gradient(circle at 50% 85%,#9ACB60,#6A9C3C)}
.card b{font-family:var(--font-display);font-size:.9rem}
.card .say{font-weight:700;font-size:.9rem}
.card .long{color:var(--muted);font-size:.82rem;margin-top:2px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

function mixc(a,b,t){const k=a+b+t;if(_cc[k])return _cc[k];const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const r=[16,8,0].map(s=>{const x=(A>>s)&255,y=(B>>s)&255;return Math.round(x+(y-x)*t)});return _cc[k]='#'+r.map(v=>v.toString(16).padStart(2,'0')).join('')}

    const gr=c.createRadialGradient(x+T*.5,y+T*.5,T*.1,x+T*.5,y+T*.5,T*.8);
    gr.addColorStop(0,SK.ov[0]);gr.addColorStop(1,SK.ov[1]);
    c.fillStyle=gr;c.fillRect(x,y,T,T);
    const pal=light?LB:DB,n=Math.round(T*1.1);
    c.lineWidth=Math.max(1,T*.024);c.lineCap='round';
    for(let k=0;k<n;k++){

    const col=SK.fl[i%4],pr=T*.026;
    for(let k=0;k<5;k++){c.fillStyle=col;c.beginPath();c.arc(x+Math.cos(k*TAU/5)*pr*1.5,y+Math.sin(k*TAU/5)*pr*1.5,pr,0,TAU);c.fill()}
    c.fillStyle=SK.fc;c.beginPath();c.arc(x,y,pr*.8,0,TAU);c.fill();

  { // gold inlay + corner studs on the wooden frame

    const gg=c.createLinearGradient(0,0,S,S);gg.addColorStop(0,'#F6D77A');gg.addColorStop(.5,'#B98A2A');gg.addColorStop(1,'#F2CC63');
    c.strokeStyle=gg;c.lineWidth=Math.max(1.2,pad*.07);c.beginPath();c.roundRect(k,k,S-2*k,S-2*k,Math.max(3,S*.02));c.stroke();
    for(const [x,y] of [[k,k],[S-k,k],[k,S-k],[S-k,S-k]]){c.fillStyle=gg;c.beginPath();c.arc(x,y,pad*.13,0,TAU);c.fill();c.strokeStyle='rgba(60,30,0,.6)';c.lineWidth=1;c.stroke()}
  }
  c.fillStyle='rgba(255,240,210,.78)';c.font='800 '+Math.max(9,pad*.5)+'px Nunito, sans-serif';c.textAlign='center';c.textBaseline='middle';
  for(let i=0;i<8;i++){
    c.fillText('abcdefgh'[flip?7-i:i],pad+(i+.5)*T,S-pad*.5);

}
function layout(){
  const w=Math.floor(stage.clientWidth);
  if(!w)return;
  dpr=Math.min(2,window.devicePixelRatio||1);
  S=w;pad=Math.round(S*(skinName==='meadow'?.1:.045));T=(S-2*pad)/8;
  cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);
  cv.style.height=S+'px';
  off.width=off.height=Math.ceil(T*2.6*dpr);
  bakes=new Map();

}
const off=document.createElement('canvas');

/* ---------- sprites ---------- */
/* idle pieces are pre-rendered once (the vector art is expensive); animated ones are drawn live */
let bakes=new Map();
const BW=2.2,BH=1.5,BAX=1.1,BAY=1.35;
const vdir=p=>{if(!skO(p.c).dirs)return undefined;const v=p.vd||(p.c==='w'?'u':'d');return v==='h'?'r':((v==='u')!==flip?'u':'d')};
function bake(t,col,dir){
  const k=t+col+pskin[col]+(dir||'')+T+'|'+dpr;let b=bakes.get(k);
  if(b)return b;
  b=document.createElement('canvas');
  b.width=Math.ceil(T*BW*dpr);b.height=Math.ceil(T*BH*dpr);
  const x=b.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);x.translate(T*BAX,T*BAY);
  const s=T/100*scO(col,t);x.scale(s,s);
  x.lineJoin='round';x.lineCap='round';x.lineWidth=3;
  drawO(col,t)(x,palO(col),{dir,t:0,id:1,ph:0,moving:false,strike:0,rear:0,wing:0,mood:'idle',blink:false});
  bakes.set(k,b);return b;
}
function drawSprite(c,p,gx,gy,tm){
  if(!p.strike&&!p.rear&&!p.wing&&!p.moving&&p.mood==='idle'){
    c.save();c.translate(gx,gy);c.rotate(flip?-p.rot:p.rot);
    c.scale((flip?-p.face:p.face)*p.sx,p.sy*(1+Math.sin(tm*2.4+p.id)*.008));
    c.rotate(p.lean);
    c.drawImage(bake(p.t,p.c,vdir(p)),-T*BAX,-T*BAY,T*BW,T*BH);
    c.restore();return;
  }
  c.save();c.translate(gx,gy);
  if(!(p.mood==='dead'&&skO(p.c).norot))c.rotate(flip?-p.rot:p.rot);
  const s=T/100*scO(p.c,p.t);
  c.scale((flip?-p.face:p.face)*p.sx*s,p.sy*s);
  c.rotate(p.lean);
  c.lineJoin='round';c.lineCap='round';c.lineWidth=3;
  odata.dir=vdir(p);odata.t=tm+p.id*.37;odata.id=p.id;odata.ph=p.ph;odata.moving=p.moving;odata.strike=p.strike;odata.rear=p.rear;odata.wing=p.wing;odata.mood=p.mood;
  odata.blink=((tm*.9+p.id*1.3)%4)<.1;

}
function paintPiece(p,idx){

  const gx=pad+(fx(p.px)+.5)*T,gy=pad+(fx(p.py)+.5)*T+T*.32-z*T;
  if(p.alpha<=0.01)return;
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.alpha));
  if(p.tint>0||p.flash>0){
    const o2=off.getContext('2d'),Ts=T*2.6;
    o2.setTransform(dpr,0,0,dpr,0,0);o2.clearRect(0,0,Ts,Ts);
    drawSprite(o2,p,Ts/2,Ts*.72,time);

    if(p.tint>0){o2.fillStyle='rgba('+p.tintCol+','+(p.tint*.65)+')';o2.fillRect(0,0,Ts,Ts)}

    o2.globalCompositeOperation='source-over';

}
function paintShadow(p){
  const gx=pad+(fx(p.px)+.5)*T,gy=pad+(fx(p.py)+.5)*T+T*.34;
  const zz=Math.max(0,p.z);
  ctx.fillStyle='rgba(10,28,4,'+(.32*(1-Math.min(.8,zz*.6))*Math.max(0,p.alpha))+')';
  ctx.beginPath();ctx.ellipse(gx,gy,T*.3*SHW[p.t]*(1-Math.min(.5,zz*.3)),T*.1,0,0,TAU);ctx.fill();

/* ---------- particles ---------- */
function star(c,r){
  c.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}

}
function addP(o){o.max=o.life;parts.push(Object.assign({x:0,y:0,z:0,vx:0,vy:0,vz:0,g:0,rot:0,vr:0,size:.1},o))}
function puff(x,y,n,col,size){for(let i=0;i<(n||6);i++)addP({k:'dust',x:x+(rand()-.5)*.3,y:y+(rand()-.5)*.15,z:.05,vx:(rand()-.5)*.9,vy:(rand()-.5)*.3,vz:.25+rand()*.4,life:.55+rand()*.2,size:(size||.12)*(.7+rand()*.6),col})}
function stars(x,y,z,n){for(let i=0;i<n;i++)addP({k:'star',x,y,z,vx:(rand()-.5)*1.4,vy:(rand()-.5)*.6,vz:.6+rand()*.8,g:1.6,rot:rand()*TAU,vr:(rand()-.5)*10,life:.9+rand()*.3,size:.09+rand()*.04})}
function feathers(x,y,z,n,col){for(let i=0;i<n;i++)addP({k:'feather',x,y,z,vx:(rand()-.5)*1,vy:(rand()-.5)*.4,vz:.2+rand()*.6,g:.9,rot:rand()*TAU,vr:(rand()-.5)*6,life:1+rand()*.5,size:.2+rand()*.1,col})}
function bubbles(x,y,n){for(let i=0;i<n;i++)addP({k:'bubble',x:x+(rand()-.5)*.4,y:y+(rand()-.5)*.2,z:.1+rand()*.3,vx:(rand()-.5)*.2,vz:.5+rand()*.5,life:.8+rand()*.4,size:.03+rand()*.04})}
function leaves(x,y,n){for(let i=0;i<n;i++)addP({k:'leaf',x,y,z:.05,vx:(rand()-.5)*1.6,vy:(rand()-.5)*.8,vz:.8+rand()*.8,g:3,rot:rand()*TAU,vr:(rand()-.5)*14,life:.7+rand()*.3,size:.05})}
function spark(x,y,z){addP({k:'spark',x:x+(rand()-.5)*.3,y:y+(rand()-.5)*.2,z,vz:.1,life:.5,size:.07+rand()*.05,rot:rand()*TAU,vr:3})}
function ring(x,y){addP({k:'ring',x,y,z:.02,life:.45})}
function pop(x,y,text,col,stroke){addP({k:'text',x,y,z:.7,vz:.5,life:1.05,text,col,stroke,rot:(rand()-.5)*.2})}
function slash(x,y,ang){addP({k:'slash',x,y,z:.4,life:.28,rot:ang})}
function updParts(dt){
  for(const q of parts){

}
function paintParts(){

    ctx.save();ctx.translate(px,py);

      case 'feather':ctx.globalAlpha=Math.min(1,a*1.5);ctx.rotate(q.rot);ctx.fillStyle=q.col;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,q.size*T*.5,q.size*T*.16,0,0,TAU);ctx.fill();ctx.stroke();break;
      case 'bubble':ctx.globalAlpha=a*.9;ctx.strokeStyle='#C4F7A8';ctx.fillStyle='rgba(120,220,90,.35)';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,q.size*T,0,TAU);ctx.fill();ctx.stroke();break;
      case 'leaf':ctx.globalAlpha=Math.min(1,a*2);ctx.rotate(q.rot);ctx.fillStyle='#6FAE3A';ctx.fillRect(-q.size*T*.5,-q.size*T*.2,q.size*T,q.size*T*.4);break;
      case 'slash':ctx.globalAlpha=a;ctx.rotate(q.rot);ctx.strokeStyle='#fff';ctx.lineCap='round';ctx.lineWidth=T*.09*a+1;ctx.beginPath();ctx.arc(-T*.2,0,T*.5,-1.0,1.0);ctx.stroke();ctx.lineWidth=T*.03;ctx.beginPath();ctx.arc(-T*.2,0,T*.4,-.8,.8);ctx.stroke();break;

/* ---------- highlights ---------- */

/* ---------- life: idle gestures + victory fireworks ---------- */
let fwT=0;
function fireworks(dt){
  fwT-=dt;if(fwT>0)return;fwT=.35+rand()*.5;
  const x=1+rand()*6,y=1+rand()*5,cols=winner==='w'?['#FFD43B','#FFF2A8','#FF9F1C']:['#9AA5FF','#E0E4FF','#6C7BFF'];
  for(let i=0;i<14;i++){const a=rand()*TAU,v=.8+rand()*1.4;addP({k:'fw',x,y,z:1.2+rand()*.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.35,vz:Math.sin(a)*v*.9,g:1.1,life:.8+rand()*.5,size:.035,col:cols[i%3]})}
  snd('pop');
}
let idleAt=3;
function idleLife(dt){
  if(busy||over||REDUCE||document.hidden)return;
  idleAt-=dt;if(idleAt>0)return;idleAt=2.5+rand()*3.5;
  const ps=[];for(let i=0;i<64;i++)if(board[i]&&!board[i].moving)ps.push(board[i]);
  if(!ps.length)return;const p=ps[(rand()*ps.length)|0];
  if(p.gest)return;p.gest=1;
  (async()=>{
    const t0=performance.now();
    try{
      if(p.t==='P'){for(let i=0;i<2;i++){await tw(240,(e,u)=>{p.z=.12*Math.sin(Math.PI*u);p.moving=true},EA.lin)}p.z=0;p.moving=false}
      else if(p.t==='N'){await tw(500,(e,u)=>{p.rear=.5*Math.sin(Math.PI*u)},EA.lin);p.rear=0}
      else if(p.t==='B'){await tw(900,(e,u)=>{p.strike=.2*Math.sin(u*Math.PI*6)*Math.sin(Math.PI*u)},EA.lin);p.strike=0}
      else if(p.t==='Q'){await tw(800,(e,u)=>{p.wing=.5+.5*Math.sin(u*28);p.z=.05*Math.sin(Math.PI*u)},EA.lin);p.wing=0;p.z=0}
      else if(p.t==='R'){const f=p.face;await tw(500,(e,u)=>{p.lean=.06*Math.sin(u*Math.PI*2)},EA.lin);p.lean=0}
      else{await tw(500,(e,u)=>{p.lean=-.05*Math.sin(Math.PI*u);p.strike=-.3*Math.sin(Math.PI*u)},EA.lin);p.lean=0;p.strike=0}
    }finally{p.gest=0;p.moving=false;p.z=0;p.rear=0;p.wing=0;p.strike=0;p.lean=0}
  })();
}

/* ---------- main loop ---------- */
let lastT=performance.now();
const icons=[];
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;time+=dt;
  if(over&&winner&&!busy){
    for(let i=0;i<64;i++){const p=board[i];if(!p)continue;
      if(p.c===winner)p.z=REDUCE?0:Math.abs(Math.sin(time*5+p.id))*.16;
      else if(p.t==='K'){p.rot+=(1.5*(p.face||1)-p.rot)*Math.min(1,dt*4)}
    }
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
  ctx.save();
  if(!REDUCE&&shake>.05){const zs=1+Math.min(shake,1.4)*.022;ctx.translate(S/2,S/2);ctx.scale(zs,zs);ctx.translate(-S/2,-S/2)}
  if(shake>.01&&!REDUCE){ctx.translate((rand()-.5)*shake*T*.2,(rand()-.5)*shake*T*.2);shake*=Math.pow(.002,dt)}else shake=0;
  ctx.drawImage(bg,0,0,S,S);
  drawMeadowFx(time);
  paintHighlights();
  const list=[];
  for(let i=0;i<64;i++)if(board[i])list.push([board[i],i]);
  for(const [p] of list)paintShadow(p);
  list.sort((a,b)=>(fx(a[0].py)+(a[0].z>.2?3:0))-(fx(b[0].py)+(b[0].z>.2?3:0)));
  for(const [p,i] of list)paintPiece(p,i);
  if(over&&winner&&!REDUCE)fireworks(dt);
  idleLife(dt);
  updParts(dt);paintParts();
  ctx.restore();
  if(!REDUCE&&(shake>.3||checked&&!over)){
    const va=checked&&!over?.18+.08*Math.sin(time*7):Math.min(.35,shake*.2);
    const g=ctx.createRadialGradient(S/2,S/2,S*.35,S/2,S/2,S*.75);g.addColorStop(0,'rgba(120,0,0,0)');g.addColorStop(1,'rgba(120,0,0,'+va+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  }
  for(const ic of icons)drawIcon(ic.cv,ic.t,ic.c,time);
  requestAnimationFrame(frame);
}

/* ---------- small icons ---------- */
function drawIcon(cvs,t,c,tm){
  const d=Math.min(2,window.devicePixelRatio||1),sz=cvs.clientWidth||cvs.width/d||28;
  const ik=t+c+pskin[c]+sz+'|'+d;if(cvs._ik===ik)return;cvs._ik=ik;
  if(cvs.width!==Math.round(sz*d)){cvs.width=Math.round(sz*d);cvs.height=Math.round(sz*d)}
  const x=cvs.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,sz,sz);
  x.translate(sz/2,sz*.9);
  const s=sz/100*scO(c,t)*.95;x.scale(s,s);
  x.lineJoin='round';x.lineCap='round';x.lineWidth=3;
  drawO(c,t)(x,palO(c),{dir:'d',t:tm||0,id:1,ph:0,moving:false,strike:0,rear:0,wing:0,mood:'idle',blink:false});
}

/* ---------- animation helpers ---------- */
const EA={lin:u=>u,io:u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,out:u=>1-Math.pow(1-u,3),inn:u=>u*u};
function tw(ms,fn,e){
  const ez=e||EA.io;
  return new Promise(res=>{
    const d=Math.max(1,ms*SPEED*slowF),t0=performance.now();
    const st=()=>{
      const u=Math.min(1,(performance.now()-t0)/d);
      fn(ez(u),u);
      if(u<1)requestAnimationFrame(st);else res();
    };
    st();
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms*SPEED*slowF));
const lerp=(a,b,t)=>a+(b-a)*t;

async function travel(p,tx,ty){
  const x0=p.px,y0=p.py,dx=tx-x0,dy=ty-y0,dist=Math.hypot(dx,dy);
  if(dist<.02){p.px=tx;p.py=ty;return}
  if(Math.abs(dx)>.05)p.face=dx>0?1:-1;
  p.vd=Math.abs(dy)>Math.abs(dx)?(dy<0?'u':'d'):'h';
  p.moving=true;
  const nx=-dy/dist,ny=dx/dist;

  }

}
async function step(a,tx,ty,ms){
  const x0=a.px,y0=a.py;
  await tw(ms||220,(e,u)=>{a.px=lerp(x0,tx,e);a.py=lerp(y0,ty,e);a.z=.03*Math.sin(Math.PI*u)},EA.io);
  a.px=tx;a.py=ty;a.z=0;
}

function mInfo(m){
  const a=board[m.f];if(!a)return {};
  const cf=m.f&7,ct=m.t&7,r=m.f>>3;
  if(a.t==='K'&&Math.abs(ct-cf)===2)return {rf:r*8+(ct>cf?7:0),rt:r*8+(ct>cf?5:3)};
  if(a.t==='P'&&cf!==ct&&!board[m.t])return {ep:r*8+ct};
  return {};
}
/* mutate the board for a move (castling rook, en-passant victim, engine state); returns the captured piece */
function commit(m){
  const a=board[m.f],ii=mInfo(m),ns=applyMove(board,m);
  let v=board[m.t];
  if(ii.ep!==undefined){v=board[ii.ep];board[ii.ep]=null}
  board[m.t]=a;board[m.f]=null;
  if(ii.rf!==undefined){const rk=board[ii.rf];board[ii.rt]=rk;board[ii.rf]=null;const f=rk.face;rest(rk,ii.rt>>3,ii.rt&7);rk.face=f}
  board[64]=ns[64];board[65]=ns[65];
  return v;
}
async function animateMove(m){
  const ii=mInfo(m);
  const a=board[m.f],v=ii.ep!==undefined?board[ii.ep]:board[m.t],tx=m.t&7,ty=m.t>>3;
  if(ii.rf!==undefined){
    const rk=board[ii.rf];
    pop(tx,ty,'Рокировка!','#FFF2A8');
    await Promise.all([travel(a,tx,ty),travel(rk,ii.rt&7,ii.rt>>3)]);
    a.mood='idle';rk.mood='idle';return;
  }
  if(v){
    const big=!REDUCE&&(v.t==='Q'||v.t==='K'||v.t==='R');
    if(big){slowF=1.6;stage.classList.add('cine')}
    try{await capture(a,v,m)}finally{slowF=1;stage.classList.remove('cine')}
  }else await travel(a,tx,ty);
  a.mood='idle';
  if(m.promo){
    const np=typeof m.promo==='string'?m.promo:'Q';a.t=np;rest2(a);snd('promo');
    pop(tx,ty,NM(a.c,np).toUpperCase()+'!','#FFF2A8');feathers(tx,ty,.4,8,palO(a.c).main);for(let i=0;i<6;i++)spark(tx,ty,.5);
    await tw(420,(e,u)=>{a.z=.25*Math.sin(Math.PI*u);a.wing=.6*Math.sin(Math.PI*u)},EA.lin);
  }
}

let aiW=null,aiSeq=0,aiPend={};

  aiW=new Worker('engine-worker.js',{type:'module'});
  aiW.onmessage=e=>{const f=aiPend[e.data.id];if(f){delete aiPend[e.data.id];f(e.data.m)}};
  aiW.onerror=()=>{aiW=null;for(const k in aiPend){const f=aiPend[k];delete aiPend[k];f(undefined)}};
}catch(e){aiW=null}
function aiMove(col,level){

  if(!aiW)return Promise.resolve(sync());
  return new Promise(res=>{
    const id=++aiSeq;aiPend[id]=m=>res(m===undefined?sync():m);
    aiW.postMessage({id,b:board.slice(0,64).map(p=>p?{t:p.t,c:p.c,id:p.id}:null),cs:[board[64],board[65]],col,level,persona:per||null});
  });
}

  const r=cv.getBoundingClientRect();

  let c=Math.floor((x-pad)/T),rr=Math.floor((y-pad)/T);
  if(c<0||c>7||rr<0||rr>7){sel=-1;selMoves=[];setHint(null);return}
  c=fx(c);rr=fx(rr);

  }else{sel=-1;selMoves=[];setHint(null)}

async function rpSeek(k){

/* ---- game analysis (engine runs in a worker, 3-ply per move) ---- */
const AN_CLS=[[5,'best','★','Ең жақсы жүріс'],[30,'good','','Жақсы'],[70,'ok','','Қалыпты'],[160,'inacc','?!','Дәлсіздік'],[360,'mist','?','Қате'],[1e9,'blun','??','Үлкен қате']];
const anCls=l=>AN_CLS.find(c=>l<=c[0]);
const sqn=s=>String.fromCharCode(97+(s&7))+(8-(s>>3));
function anNote(){
  if(!rp||!rp.an||!rp.an.res||rp.k<1)return '';
  const r=rp.an.res[rp.k-1];if(!r)return '';
  const c=anCls(r.loss);
  return ' · '+c[3]+(c[1]==='inacc'||c[1]==='mist'||c[1]==='blun'?' (жақсысы: '+sqn(r.best.f)+'→'+sqn(r.best.t)+')':'');
}
function anPaint(){
  const box=$('#anBox');
  if(!rp||!rp.an){box.hidden=true;return}
  box.hidden=false;
  if(!rp.an.res){box.textContent='Талдау: '+rp.an.done+' / '+rp.moves.length+'…';return}
  const cv=box.querySelector('canvas');if(!cv)return;
  const x=cv.getContext('2d'),W=cv.width,H=cv.height,n=rp.an.res.length,bw=W/Math.max(n,1);
  x.clearRect(0,0,W,H);
  x.fillStyle='rgba(128,128,128,.25)';x.fillRect(0,H/2-.5,W,1);
  rp.an.res.forEach((r,k)=>{
    const v=Math.max(-600,Math.min(600,r.ev))/600*(H/2-2);
    x.fillStyle=k===rp.k-1?'#e0a020':(v>=0?'#d9b24a':'#5560D6');
    x.globalAlpha=k===rp.k-1?1:.75;
    x.fillRect(k*bw,v>=0?H/2-v:H/2,Math.max(1,bw-1),Math.max(1,Math.abs(v)));
  });
  x.globalAlpha=1;
  box.querySelectorAll('.anchip').forEach((c,k)=>c.classList.toggle('cur',k===rp.k-1));
}
function anRender(){
  const box=$('#anBox');box.textContent='';
  const res=rp.an.res,acc=s=>{const l=res.filter((_,k)=>k%2===s).map(r=>Math.min(r.loss,300));return l.length?Math.round(100*Math.exp(-(l.reduce((a,b)=>a+b,0)/l.length)/120)):0};
  const names=[rp.white&&rp.white.name||'Күн',rp.black&&rp.black.name||'Түн'];
  const sum=document.createElement('div');sum.className='ansum';
  sum.textContent='Дәлдік: '+names[0]+' '+acc(0)+'% · '+names[1]+' '+acc(1)+'%';box.append(sum);
  const cv=document.createElement('canvas');cv.width=600;cv.height=90;cv.className='angraph';
  cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();rpSeek(Math.floor((e.clientX-r.left)/r.width*res.length)+1)});
  box.append(cv);
  const cl=document.createElement('div');cl.className='anchips';
  res.forEach((r,k)=>{

async function runAnalysis(){
  if(!rp)return;
  if(rp.an&&rp.an.res){anRender();return}
  if(rp.an)return;
  const moves=rp.moves.slice(),an=rp.an={done:0,res:null};
  anPaint();
  const fin=res=>{if(rp&&rp.an===an){an.res=res;anRender();rpShow()}};
  try{
    const w=new Worker('engine-worker.js',{type:'module'});
    w.onmessage=e=>{if(e.data.progress){an.done=e.data.progress;if(rp&&rp.an===an&&!an.res)anPaint()}if(e.data.done){w.terminate();fin(e.data.res)}};
    w.onerror=async()=>{w.terminate();const res=[];for(let k=0;k<moves.length;k++){res.push(analyzePly(moves,k));an.done=k+1;anPaint();await wait(0)}fin(res)};
    w.postMessage({analyze:true,id:1,moves});
  }catch(e){const res=[];for(let k=0;k<moves.length;k++){res.push(analyzePly(moves,k));an.done=k+1;anPaint();await wait(0)}fin(res)}
}

const PZ_TXT='Жұмбақ: ақ жүреді, 2 жүріспен мат қой';
async function startPuzzle(){
  clearTimeout(pollT);
  if(net&&net.you&&net.mode==='pvp'&&net.status==='active'){PL().toast('♟️','Алдымен онлайн ойынды аяқта');return}
  mode='puz';segMode='puz';campStage=0;net=null;

  busy=true;setStatus('Жұмбақ жүктелуде…','w');
  const g=gen,r=await PL().api('puzzle');
  if(g!==gen)return;
  busy=false;
  if(!r.board){setStatus('Жұмбақ жүктелмеді','w');PL().toast('⚠️',r.error||'Қате');return}
  board=r.board.map((p,i)=>p?mk(p.t,p.c,0,i):null);board[64]=0;board[65]=-1;
  idc=100;turn='w';last=null;lost={w:[],b:[]};hist=[];locLog=[];
  pz={n:r.n,solved:r.solved,moves:[],stage:0,tries:0,reward:r.reward,done:false};
  $('#result').hidden=true;
  afterMove(true);
  setStatus(PZ_TXT+' · №'+r.n+(r.solved?' ✅':''),'w');
  renderBars();refreshUI();
}
async function puzMove(mv){
  const p=pz;if(!p||p.done)return;
  const mvo={f:mv.f,t:mv.t};
  if(p.stage===0){
    busy=true;
    const r=await PL().api('puzzle',{method:'POST',body:{step:1,m1:mvo}});
    busy=false;
    if(pz!==p)return;
    if(!r.good){p.tries++;sel=-1;selMoves=[];setStatus('Бұл жүріс матқа әкелмейді. Тағы ойлан ('+p.tries+')','w');snd('check');shake=Math.max(shake,.5);setTimeout(()=>{if(pz===p&&!p.done)setStatus(PZ_TXT+' · №'+p.n,'w')},2200);return}
    p.moves.push(mvo);
    await playMove(mv);
    if(pz!==p)return;
    if(r.done||over){return puzSolved(p)}
    p.stage=1;
    if(r.reply){
      await wait(350);
      p.moves.push(r.reply);
      await playMove({f:r.reply.f,t:r.reply.t,promo:legal(board,'b').find(x=>x.f===r.reply.f&&x.t===r.reply.t)?.promo});
      if(pz!==p)return;
    }
    setStatus('Енді мат қой!','w');
    return;
  }
  // second move: must mate
  const pre=snap();
  await playMove(mv);
  if(pz!==p)return;
  if(over&&winner==='w'){p.moves.push(mvo);return puzSolved(p)}
  // not mate: take it back
  p.tries++;
  hist.pop();restoreSnap(pre);
  setStatus('Мат емес. Тағы бір рет ойлан','w');
}
async function puzSolved(p){
  p.done=true;
  const r=await PL().api('puzzle',{method:'POST',body:{step:2,moves:p.moves}});
  setStatus('Шештің! 🎉','w');document.body.classList.add('finale');
  $('#resT').textContent='Жұмбақ шешілді! 🧩';
  $('#resS').textContent=r.good?(r.reward?'+'+r.reward+' тиын':'Бүгінгі сыйлық алынған'):'Шешім расталмады';
  $('#resFriend').hidden=true;$('#result').hidden=false;
  if(r.good&&r.reward)PL().toast('🧩','Жұмбақ шешілді','+'+r.reward+' тиын');
  snd('end',true);
}

  if(rp){rp=null;$('#rpanel').hidden=true;$('#pbTop').hidden=$('#pbBot').hidden=true}

    mode='ai';segMode='camp';campStage=0;net=null;setFlip(false);resetLocal();syncSeg();renderBars();refreshUI();showCampMap();return;

      else{net.public=true;showLobby('wait')}
      renderBars();refreshUI();startPoll();resumed=true;
      P.toast('♟️','Ойын жалғасты','Тоқтаған жерден жалғастырдық');
    }
  }
  if(!resumed)await newGame();
  if(jp){
    history.replaceState(null,'',location.pathname);
    if(P.isIn())joinCode(jp);else{P.toast('🔑','Ойынға қосылу үшін кіріңіз');P.login();const once=()=>{if(P.isIn()){joinCode(jp)}};P.onAuth(once,true)}
  }
  if(wid){history.replaceState(null,'',location.pathname);await watchMatch(wid)}
  if(rid){
    history.replaceState(null,'',location.pathname);
    const r=await napi(null,'?id='+encodeURIComponent(rid));
    if(r.match&&r.match.moves&&r.match.moves.length&&r.match.status==='done')startReplay(r.match.moves,r.match);
    else P.toast('⚠️','Ойын табылмады немесе әлі аяқталмаған');
  }
  P.onAuth(()=>applySkin());applySkin();
  P.onAuth(st=>{
    if(st==='out'){if(net&&net.mode==='pvp')clearTimeout(pollT);net=null;if(mode==='net'){resetLocal();setFlip(false);showLobby('menu')}else newGame();renderBars();refreshUI()}
    else if(st==='in'){if(mode==='ai'&&!net&&!busy&&!hist.length)newGame();else if(mode==='net'&&!net)showLobby('menu')}
  });
}
/* ---------- start ---------- */
new ResizeObserver(layout).observe(stage);
layout();
resetLocal();
startup();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildBoard()});
requestAnimationFrame(frame);
})();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
</body>
