.dot{width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--fg);flex:none}

.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.stage{position:relative}

.result div{display:grid;min-width:0}
.result strong{font-family:var(--font-display);font-size:1rem}
.result span{color:var(--muted);font-size:.85rem}
.btn{border:2px solid var(--fg);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;flex:none}
.btn.ghost{background:transparent;color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.hint{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:4.4em}
.hint b{font-family:var(--font-display);font-size:.92rem}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.lost{display:grid;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;min-height:34px}
.lrow .tag{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted);width:92px;flex:none}

.lrow .items{display:flex;flex-wrap:wrap;gap:2px;min-width:0}

.card .say{font-weight:700;font-size:.9rem}
.card .long{color:var(--muted);font-size:.82rem;margin-top:2px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}

/* ---------- board background (grass) ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildBoard(){
  bg.width=Math.round(S*dpr);bg.height=Math.round(S*dpr);
  const c=bg.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const rnd=mulberry(20261010);
  const g=c.createLinearGradient(0,0,0,S);g.addColorStop(0,'#5E432A');g.addColorStop(1,'#3C2A18');
  c.fillStyle=g;c.beginPath();c.roundRect(0,0,S,S,S*.03);c.fill();
  for(let i=0;i<200;i++){
    c.strokeStyle='rgba(255,235,200,'+(rnd()*.07)+')';c.lineWidth=1;
    const x=rnd()*S,y=rnd()*S;c.beginPath();c.moveTo(x,y);c.lineTo(x+rnd()*14-7,y+rnd()*3);c.stroke();
  }
  const LB=['#A7D56A','#82B44B','#B6DF7B','#76A83F'],DB=['#7DB147','#5C8E32','#8CC05A','#4F8029'];
  for(let r=0;r<8;r++)for(let q=0;q<8;q++){
    const x=pad+q*T,y=pad+r*T,light=(r+q)%2===0;
    c.save();c.beginPath();c.rect(x,y,T,T);c.clip();
    c.fillStyle=light?'#93C459':'#6B9D3D';c.fillRect(x,y,T,T);
    const gr=c.createRadialGradient(x+T*.5,y+T*.5,T*.1,x+T*.5,y+T*.5,T*.8);
    gr.addColorStop(0,'rgba(255,255,200,.10)');gr.addColorStop(1,'rgba(0,40,0,.10)');
    c.fillStyle=gr;c.fillRect(x,y,T,T);
    const pal=light?LB:DB,n=Math.round(T*1.1);
    c.lineWidth=Math.max(1,T*.024);c.lineCap='round';
    for(let k=0;k<n;k++){
      const bx=x+rnd()*T,by=y+rnd()*T,len=T*(.08+rnd()*.13),ang=(rnd()-.5)*.9;
      c.strokeStyle=pal[Math.floor(rnd()*pal.length)];
      c.beginPath();c.moveTo(bx,by);
      c.quadraticCurveTo(bx+Math.sin(ang)*len*.3,by-len*.6,bx+Math.sin(ang)*len,by-Math.cos(ang)*len);c.stroke();
    }
    c.restore();
  }
  for(let i=0;i<16;i++){
    const r=Math.floor(rnd()*8),q=Math.floor(rnd()*8);
    const x=pad+q*T+T*(.12+rnd()*.76),y=pad+r*T+T*(.55+rnd()*.4);
    const col=['#FFFFFF','#FFE066','#FFB3C7','#FFFFFF'][i%4],pr=T*.026;
    for(let k=0;k<5;k++){c.fillStyle=col;c.beginPath();c.arc(x+Math.cos(k*TAU/5)*pr*1.5,y+Math.sin(k*TAU/5)*pr*1.5,pr,0,TAU);c.fill()}
    c.fillStyle='#F2A900';c.beginPath();c.arc(x,y,pr*.8,0,TAU);c.fill();
  }
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=2;c.strokeRect(pad,pad,T*8,T*8);
  { // gold inlay + corner studs on the wooden frame
    const k=pad*.17;
    const gg=c.createLinearGradient(0,0,S,S);gg.addColorStop(0,'#F6D77A');gg.addColorStop(.5,'#B98A2A');gg.addColorStop(1,'#F2CC63');
    c.strokeStyle=gg;c.lineWidth=Math.max(1.2,pad*.07);c.beginPath();c.roundRect(k,k,S-2*k,S-2*k,Math.max(3,S*.02));c.stroke();
    for(const [x,y] of [[k,k],[S-k,k],[k,S-k],[S-k,S-k]]){c.fillStyle=gg;c.beginPath();c.arc(x,y,pad*.13,0,TAU);c.fill();c.strokeStyle='rgba(60,30,0,.6)';c.lineWidth=1;c.stroke()}
  }
  c.fillStyle='rgba(255,240,210,.78)';c.font='800 '+Math.max(9,pad*.5)+'px Nunito, sans-serif';c.textAlign='center';c.textBaseline='middle';
  for(let i=0;i<8;i++){
    c.fillText('abcdefgh'[flip?7-i:i],pad+(i+.5)*T,S-pad*.5);
    c.fillText(String(flip?i+1:8-i),pad*.5,pad+(i+.5)*T);

}
function layout(){
  const w=Math.floor(stage.clientWidth);

  dpr=Math.min(2,window.devicePixelRatio||1);
  S=w;pad=Math.round(S*.045);T=(S-2*pad)/8;
  cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);

const off=document.createElement('canvas');

/* ---------- sprites ---------- */
/* idle pieces are pre-rendered once (the vector art is expensive); animated ones are drawn live */
let bakes=new Map();
const BW=2.2,BH=1.5,BAX=1.1,BAY=1.35;
function bake(t,col){
  const k=t+col+T+'|'+dpr;let b=bakes.get(k);
  if(b)return b;
  b=document.createElement('canvas');
  b.width=Math.ceil(T*BW*dpr);b.height=Math.ceil(T*BH*dpr);
  const x=b.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);x.translate(T*BAX,T*BAY);
  const s=T/100*SC[t];x.scale(s,s);
  x.lineJoin='round';x.lineCap='round';x.lineWidth=3;
  DRAW[t](x,PAL[col],{t:0,id:1,ph:0,moving:false,strike:0,rear:0,wing:0,mood:'idle',blink:false});
  bakes.set(k,b);return b;
}
function drawSprite(c,p,gx,gy,tm){
  if(!p.strike&&!p.rear&&!p.wing&&!p.moving&&p.mood==='idle'){
    c.save();c.translate(gx,gy);c.rotate(flip?-p.rot:p.rot);
    c.scale((flip?-p.face:p.face)*p.sx,p.sy*(1+Math.sin(tm*2.4+p.id)*.008));
    c.rotate(p.lean);
    c.drawImage(bake(p.t,p.c),-T*BAX,-T*BAY,T*BW,T*BH);
    c.restore();return;
  }
  c.save();c.translate(gx,gy);
  c.rotate(flip?-p.rot:p.rot);
  const s=T/100*SC[p.t];
  c.scale((flip?-p.face:p.face)*p.sx*s,p.sy*s);
  c.rotate(p.lean);
  c.lineJoin='round';c.lineCap='round';c.lineWidth=3;
  odata.t=tm+p.id*.37;odata.id=p.id;odata.ph=p.ph;odata.moving=p.moving;odata.strike=p.strike;odata.rear=p.rear;odata.wing=p.wing;odata.mood=p.mood;
  odata.blink=((tm*.9+p.id*1.3)%4)<.1;
  DRAW[p.t](c,PAL[p.c],odata);
  c.restore();
}
function paintPiece(p,idx){
  let z=p.z;
  if(idx===sel&&!busy&&!REDUCE)z+=.05+.05*Math.abs(Math.sin(time*6));
  const gx=pad+(fx(p.px)+.5)*T,gy=pad+(fx(p.py)+.5)*T+T*.32-z*T;
  if(p.alpha<=0.01)return;
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.alpha));
  if(p.tint>0||p.flash>0){
    const o2=off.getContext('2d'),Ts=T*2.6;
    o2.setTransform(dpr,0,0,dpr,0,0);o2.clearRect(0,0,Ts,Ts);
    drawSprite(o2,p,Ts/2,Ts*.72,time);
    o2.globalCompositeOperation='source-atop';
    if(p.tint>0){o2.fillStyle='rgba('+p.tintCol+','+(p.tint*.65)+')';o2.fillRect(0,0,Ts,Ts)}
    if(p.flash>0){o2.fillStyle='rgba(255,255,255,'+(p.flash*.85)+')';o2.fillRect(0,0,Ts,Ts)}
    o2.globalCompositeOperation='source-over';
    ctx.drawImage(off,gx-Ts/2,gy-Ts*.72,Ts,Ts);
  }else drawSprite(ctx,p,gx,gy,time);

}
function paintShadow(p){
  const gx=pad+(fx(p.px)+.5)*T,gy=pad+(fx(p.py)+.5)*T+T*.34;
  const zz=Math.max(0,p.z);
  ctx.fillStyle='rgba(10,28,4,'+(.32*(1-Math.min(.8,zz*.6))*Math.max(0,p.alpha))+')';

/* ---------- particles ---------- */
function star(c,r){

}
function addP(o){o.max=o.life;parts.push(Object.assign({x:0,y:0,z:0,vx:0,vy:0,vz:0,g:0,rot:0,vr:0,size:.1},o))}

function bubbles(x,y,n){for(let i=0;i<n;i++)addP({k:'bubble',x:x+(rand()-.5)*.4,y:y+(rand()-.5)*.2,z:.1+rand()*.3,vx:(rand()-.5)*.2,vz:.5+rand()*.5,life:.8+rand()*.4,size:.03+rand()*.04})}
function leaves(x,y,n){for(let i=0;i<n;i++)addP({k:'leaf',x,y,z:.05,vx:(rand()-.5)*1.6,vy:(rand()-.5)*.8,vz:.8+rand()*.8,g:3,rot:rand()*TAU,vr:(rand()-.5)*14,life:.7+rand()*.3,size:.05})}
function spark(x,y,z){addP({k:'spark',x:x+(rand()-.5)*.3,y:y+(rand()-.5)*.2,z,vz:.1,life:.5,size:.07+rand()*.05,rot:rand()*TAU,vr:3})}
function ring(x,y){addP({k:'ring',x,y,z:.02,life:.45})}
function pop(x,y,text,col,stroke){addP({k:'text',x,y,z:.7,vz:.5,life:1.05,text,col,stroke,rot:(rand()-.5)*.2})}

function updParts(dt){
  for(const q of parts){
    q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=q.g*dt;q.rot+=q.vr*dt;
    if(q.k==='feather')q.x+=Math.sin(q.life*8)*.3*dt;

}
function paintParts(){
  for(const q of parts){
    const a=Math.max(0,q.life/q.max);
    const px=pad+(fx(q.x)+.5)*T,py=pad+(fx(q.y)+.5)*T+T*.32-q.z*T;
    ctx.save();ctx.translate(px,py);
    switch(q.k){
      case 'dust':ctx.globalAlpha=a*.55;ctx.fillStyle=q.col||'#d8c9a3';ctx.beginPath();ctx.arc(0,0,q.size*T*(1+(1-a)*1.6),0,TAU);ctx.fill();break;
      case 'star':ctx.globalAlpha=Math.min(1,a*2);ctx.rotate(q.rot);star(ctx,q.size*T);break;
      case 'feather':ctx.globalAlpha=Math.min(1,a*1.5);ctx.rotate(q.rot);ctx.fillStyle=q.col;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,q.size*T*.5,q.size*T*.16,0,0,TAU);ctx.fill();ctx.stroke();break;
      case 'bubble':ctx.globalAlpha=a*.9;ctx.strokeStyle='#C4F7A8';ctx.fillStyle='rgba(120,220,90,.35)';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,q.size*T,0,TAU);ctx.fill();ctx.stroke();break;
      case 'leaf':ctx.globalAlpha=Math.min(1,a*2);ctx.rotate(q.rot);ctx.fillStyle='#6FAE3A';ctx.fillRect(-q.size*T*.5,-q.size*T*.2,q.size*T,q.size*T*.4);break;
      case 'slash':ctx.globalAlpha=a;ctx.rotate(q.rot);ctx.strokeStyle='#fff';ctx.lineCap='round';ctx.lineWidth=T*.09*a+1;ctx.beginPath();ctx.arc(-T*.2,0,T*.5,-1.0,1.0);ctx.stroke();ctx.lineWidth=T*.03;ctx.beginPath();ctx.arc(-T*.2,0,T*.4,-.8,.8);ctx.stroke();break;
      case 'fw':ctx.globalAlpha=a;ctx.fillStyle=q.col;ctx.shadowColor=q.col;ctx.shadowBlur=T*.12;ctx.beginPath();ctx.arc(0,0,q.size*T*(.6+a),0,TAU);ctx.fill();break;
      case 'ring':{const rr=T*(.12+(1-a)*.75);ctx.globalAlpha=a*.8;ctx.strokeStyle='#fff';ctx.lineWidth=3*a+1;ctx.beginPath();ctx.ellipse(0,0,rr,rr*.45,0,0,TAU);ctx.stroke();break}
      case 'spark':{ctx.globalAlpha=a;ctx.rotate(q.rot);const r=q.size*T;ctx.fillStyle='#FFF6B0';ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(0,0,r,0);ctx.quadraticCurveTo(0,0,0,r);ctx.quadraticCurveTo(0,0,-r,0);ctx.quadraticCurveTo(0,0,0,-r);ctx.fill();break}
      case 'text':{
        const u=1-a,sc=u<.2?.5+(u/.2)*.7:1.2-(u-.2)*.2;
        ctx.globalAlpha=a<.25?a*4:1;ctx.rotate(q.rot);
        ctx.font='800 '+(T*.34*sc)+'px Unbounded, Nunito, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.lineJoin='round';ctx.lineWidth=T*.08;ctx.strokeStyle=q.stroke||'#2B1A05';ctx.fillStyle=q.col||'#FFF2A8';
        ctx.strokeText(q.text,0,0);ctx.fillText(q.text,0,0);break;
      }
    }
    ctx.restore();
  }
}

/* ---------- highlights ---------- */
function paintHighlights(){
  const sq=(i,fill)=>{ctx.fillStyle=fill;ctx.fillRect(pad+fx(i&7)*T,pad+fx(i>>3)*T,T,T)};
  if(last){sq(last.f,'rgba(255,236,120,.26)');sq(last.t,'rgba(255,236,120,.34)')}
  if(checked&&!over){const k=kingSq(board,turn);if(k>=0){
    const x=pad+(fx(k&7)+.5)*T,y=pad+(fx(k>>3)+.5)*T,g=ctx.createRadialGradient(x,y,T*.1,x,y,T*.6);
    const a=.45+.2*Math.sin(time*7);g.addColorStop(0,'rgba(255,60,40,'+a+')');g.addColorStop(1,'rgba(255,60,40,0)');
    ctx.fillStyle=g;ctx.fillRect(x-T*.6,y-T*.6,T*1.2,T*1.2);
  }}
  if(sel>=0){
    sq(sel,'rgba(255,213,74,.34)');
    ctx.strokeStyle='#FFD54A';ctx.lineWidth=3;ctx.strokeRect(pad+fx(sel&7)*T+1.5,pad+fx(sel>>3)*T+1.5,T-3,T-3);
  }
  for(const m of selMoves){
    const x=pad+(fx(m.t&7)+.5)*T,y=pad+(fx(m.t>>3)+.5)*T;
    if(board[m.t]){
      const pu=.5+.5*Math.sin(time*7);
      sq(m.t,'rgba(230,60,40,'+(.16+.1*pu)+')');
      ctx.strokeStyle='rgba(235,60,40,.95)';ctx.lineWidth=T*.06;ctx.beginPath();ctx.arc(x,y,T*.4,0,TAU);ctx.stroke();
    }else{
      ctx.fillStyle='rgba(255,255,255,.82)';ctx.strokeStyle='rgba(20,50,10,.45)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,T*.12,0,TAU);ctx.fill();ctx.stroke();
    }
  }
}

/* ---------- life: idle gestures + victory fireworks ---------- */
let fwT=0;
function fireworks(dt){
  fwT-=dt;if(fwT>0)return;fwT=.35+rand()*.5;
  const x=1+rand()*6,y=1+rand()*5,cols=winner==='w'?['#FFD43B','#FFF2A8','#FF9F1C']:['#9AA5FF','#E0E4FF','#6C7BFF'];
  for(let i=0;i<14;i++){const a=rand()*TAU,v=.8+rand()*1.4;addP({k:'fw',x,y,z:1.2+rand()*.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.35,vz:Math.sin(a)*v*.9,g:1.1,life:.8+rand()*.5,size:.035,col:cols[i%3]})}
  snd('pop');
}
let idleAt=3;
function idleLife(dt){
  if(busy||over||REDUCE||document.hidden)return;
  idleAt-=dt;if(idleAt>0)return;idleAt=2.5+rand()*3.5;
  const ps=[];for(let i=0;i<64;i++)if(board[i]&&!board[i].moving)ps.push(board[i]);
  if(!ps.length)return;const p=ps[(rand()*ps.length)|0];
  if(p.gest)return;p.gest=1;
  (async()=>{
    const t0=performance.now();
    try{
      if(p.t==='P'){for(let i=0;i<2;i++){await tw(240,(e,u)=>{p.z=.12*Math.sin(Math.PI*u);p.moving=true},EA.lin)}p.z=0;p.moving=false}
      else if(p.t==='N'){await tw(500,(e,u)=>{p.rear=.5*Math.sin(Math.PI*u)},EA.lin);p.rear=0}
      else if(p.t==='B'){await tw(900,(e,u)=>{p.strike=.2*Math.sin(u*Math.PI*6)*Math.sin(Math.PI*u)},EA.lin);p.strike=0}
      else if(p.t==='Q'){await tw(800,(e,u)=>{p.wing=.5+.5*Math.sin(u*28);p.z=.05*Math.sin(Math.PI*u)},EA.lin);p.wing=0;p.z=0}
      else if(p.t==='R'){const f=p.face;await tw(500,(e,u)=>{p.lean=.06*Math.sin(u*Math.PI*2)},EA.lin);p.lean=0}
      else{await tw(500,(e,u)=>{p.lean=-.05*Math.sin(Math.PI*u);p.strike=-.3*Math.sin(Math.PI*u)},EA.lin);p.lean=0;p.strike=0}
    }finally{p.gest=0;p.moving=false;p.z=0;p.rear=0;p.wing=0;p.strike=0;p.lean=0}
  })();
}

/* ---------- main loop ---------- */
let lastT=performance.now();
const icons=[];
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;time+=dt;
  if(over&&winner&&!busy){
    for(let i=0;i<64;i++){const p=board[i];if(!p)continue;
      if(p.c===winner)p.z=REDUCE?0:Math.abs(Math.sin(time*5+p.id))*.16;
      else if(p.t==='K'){p.rot+=(1.5*(p.face||1)-p.rot)*Math.min(1,dt*4)}
    }
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
  ctx.save();
  if(!REDUCE&&shake>.05){const zs=1+Math.min(shake,1.4)*.022;ctx.translate(S/2,S/2);ctx.scale(zs,zs);ctx.translate(-S/2,-S/2)}
  if(shake>.01&&!REDUCE){ctx.translate((rand()-.5)*shake*T*.2,(rand()-.5)*shake*T*.2);shake*=Math.pow(.002,dt)}else shake=0;
  ctx.drawImage(bg,0,0,S,S);
  paintHighlights();
  const list=[];
  for(let i=0;i<64;i++)if(board[i])list.push([board[i],i]);
  for(const [p] of list)paintShadow(p);
  list.sort((a,b)=>(fx(a[0].py)+(a[0].z>.2?3:0))-(fx(b[0].py)+(b[0].z>.2?3:0)));
  for(const [p,i] of list)paintPiece(p,i);
  if(over&&winner&&!REDUCE)fireworks(dt);
  idleLife(dt);
  updParts(dt);paintParts();
  ctx.restore();
  if(!REDUCE&&(shake>.3||checked&&!over)){
    const va=checked&&!over?.18+.08*Math.sin(time*7):Math.min(.35,shake*.2);
    const g=ctx.createRadialGradient(S/2,S/2,S*.35,S/2,S/2,S*.75);g.addColorStop(0,'rgba(120,0,0,0)');g.addColorStop(1,'rgba(120,0,0,'+va+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  }
  for(const ic of icons)drawIcon(ic.cv,ic.t,ic.c,time);
  requestAnimationFrame(frame);
}

/* ---------- small icons ---------- */
function drawIcon(cvs,t,c,tm){
  const d=Math.min(2,window.devicePixelRatio||1),sz=cvs.clientWidth||cvs.width/d||28;
  const ik=t+c+sz+'|'+d;if(cvs._ik===ik)return;cvs._ik=ik;
  if(cvs.width!==Math.round(sz*d)){cvs.width=Math.round(sz*d);cvs.height=Math.round(sz*d)}
  const x=cvs.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,sz,sz);
  x.translate(sz/2,sz*.9);
  const s=sz/100*SC[t]*.95;x.scale(s,s);
  x.lineJoin='round';x.lineCap='round';x.lineWidth=3;
  DRAW[t](x,PAL[c],{t:tm||0,id:1,ph:0,moving:false,strike:0,rear:0,wing:0,mood:'idle',blink:false});
}

/* ---------- animation helpers ---------- */
const EA={lin:u=>u,io:u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,out:u=>1-Math.pow(1-u,3),inn:u=>u*u};
function tw(ms,fn,e){
  const ez=e||EA.io;
  return new Promise(res=>{
    const d=Math.max(1,ms*SPEED*slowF),t0=performance.now();
    const st=()=>{
      const u=Math.min(1,(performance.now()-t0)/d);
      fn(ez(u),u);
      if(u<1)requestAnimationFrame(st);else res();
    };
    st();
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms*SPEED*slowF));
const lerp=(a,b,t)=>a+(b-a)*t;

async function travel(p,tx,ty){
  const x0=p.px,y0=p.py,dx=tx-x0,dy=ty-y0,dist=Math.hypot(dx,dy);
  if(dist<.02){p.px=tx;p.py=ty;return}
  if(Math.abs(dx)>.05)p.face=dx>0?1:-1;
  p.moving=true;
  const nx=-dy/dist,ny=dx/dist;
  const set=k=>{p.px=x0+dx*k;p.py=y0+dy*k};
  if(p.t==='P'){
    const hops=Math.max(1,Math.round(dist));
    for(let h=0;h<hops;h++){
      const a=h/hops,b=(h+1)/hops;
      await tw(280,(e,u)=>{set(a+(b-a)*u);p.z=.32*Math.sin(Math.PI*u);p.sy=1+.12*Math.sin(Math.PI*u);p.sx=1-.06*Math.sin(Math.PI*u)},EA.lin);
      p.z=0;p.sx=1;p.sy=1;puff(p.px,p.py,2,undefined,.07);snd('hop');
      await tw(70,e=>{p.sy=1-.16*Math.sin(Math.PI*e)},EA.lin);
    }
  }else if(p.t==='K'){
    snd('walk');
    await tw(380*dist+60,(e,u)=>{set(e);p.ph=u*dist*7;p.z=.035*Math.abs(Math.sin(u*dist*Math.PI*2))},EA.io);
  }else if(p.t==='N'){
    snd('gallop');
    await tw(120,e=>{p.sy=1-.12*e},EA.out);
    await tw(520,(e,u)=>{set(u);p.z=.6*Math.sin(Math.PI*u);p.sy=1-.12*(1-Math.min(1,u*4));p.rear=.4*Math.sin(Math.PI*u);p.ph=u*10},EA.lin);
    p.sy=1;p.rear=0;puff(p.px,p.py,5);shake=Math.max(shake,.25);
  }else if(p.t==='R'){
    p.lean=.05;snd('walk');
    await tw(170+190*dist,(e,u)=>{set(e);p.ph=u*dist*9;p.z=.015*Math.abs(Math.sin(u*dist*Math.PI*3))},EA.io);
    p.lean=0;puff(p.px,p.py,3);
  }else if(p.t==='B'){
    snd('slither');
    await tw(200+170*dist,(e,u)=>{const w=.1*Math.sin(u*dist*Math.PI*3)*Math.sin(Math.PI*u);p.px=x0+dx*e+nx*w;p.py=y0+dy*e+ny*w;p.strike=.18*Math.sin(u*dist*14)},EA.io);
    p.strike=0;
  }else{
    snd('flap');
    await tw(380+120*dist,(e,u)=>{set(e);p.z=.75*Math.min(1,u*4,(1-u)*4);p.wing=.45+.55*Math.sin(u*(10+dist*5))},EA.io);
    p.z=0;p.wing=0;puff(p.px,p.py,4,undefined,.08);
  }
  p.px=tx;p.py=ty;p.moving=false;p.ph=0;p.z=0;p.sx=1;p.sy=1;
}
async function step(a,tx,ty,ms){
  const x0=a.px,y0=a.py;
  await tw(ms||220,(e,u)=>{a.px=lerp(x0,tx,e);a.py=lerp(y0,ty,e);a.z=.03*Math.sin(Math.PI*u)},EA.io);
  a.px=tx;a.py=ty;a.z=0;
}

async function capture(a,v,m){
  const ax=a.px,ay=a.py,vx=v.px,vy=v.py;
  const dx=vx-ax,dy=vy-ay,dist=Math.hypot(dx,dy),ux=dx/dist,uy=dy/dist;
  if(Math.abs(dx)>.05){a.face=dx>0?1:-1}
  v.face=a.face>0?-1:1;
  a.mood='angry';
  const col=PAL[v.c];
  if(a.t!=='Q'){
    const reach=a.t==='B'?.95:.85;
    if(dist>reach)await travel(a,vx-ux*reach,vy-uy*reach);
  }
  if(a.t==='P'){
    await tw(130,e=>{a.sy=1-.2*e;a.sx=1+.12*e},EA.out);
    const sx0=a.px,sy0=a.py;
    await tw(380,(e,u)=>{a.px=lerp(sx0,vx,u);a.py=lerp(sy0,vy,u);a.z=.7*Math.sin(Math.PI*u);a.sy=1+.15*Math.sin(Math.PI*u);a.sx=1;a.rot=-.3*Math.sin(Math.PI*u)*a.face},EA.lin);
    a.z=0;a.sy=1;a.rot=0;a.px=vx;a.py=vy;
    v.mood='dead';shake=.6;pop(vx,vy,'ТАҚ!');snd('hitP');puff(vx,vy,7);stars(vx,vy,.5,5);
    await tw(100,e=>{v.sy=1-.65*e;v.sx=1+.35*e},EA.out);
    await Promise.all([tw(260,(e,u)=>{a.z=.22*Math.sin(Math.PI*u)},EA.lin),tw(560,e=>{v.alpha=1-e;v.sy=.35-.3*e},EA.inn)]);
  }else if(a.t==='N'){
    await tw(300,e=>{a.rear=e},EA.out);
    await wait(60);
    await tw(110,e=>{a.rear=1-e},EA.inn);
    v.mood='dead';v.flash=1;shake=1;pop(vx,vy,'ТЕП!');snd('kick');puff(vx,vy,7);ring(vx,vy);leaves(vx,vy,8);stars(vx,vy,.5,4);
    const kx=vx+ux*1.8,ky=vy+uy*1.8,sp=(ux>=0?1:-1)*7;
    await tw(780,(e,u)=>{v.px=lerp(vx,kx,e);v.py=lerp(vy,ky,e);v.z=1.2*Math.sin(Math.PI*u);v.rot=u*sp;v.flash=Math.max(0,1-u*4);v.alpha=u>.65?1-(u-.65)/.35:1;v.sx=v.sy=1-.3*u},EA.lin);
    await step(a,vx,vy,220);
  }else if(a.t==='R'){
    const bx=a.px,by=a.py;
    await tw(260,e=>{a.lean=-.1*e;a.px=bx-ux*.12*e;a.py=by-uy*.12*e},EA.out);
    const cx=a.px,cy=a.py;
    await tw(170,(e,u)=>{a.px=lerp(cx,vx,e);a.py=lerp(cy,vy,e);a.lean=lerp(-.1,.14,e);a.ph=u*30;a.moving=true},EA.inn);
    a.moving=false;
    v.mood='dead';v.flash=1;shake=1.3;ring(vx,vy);puff(vx,vy,10,undefined,.16);pop(vx,vy,'ГҮМ!');snd('boom');
    const kx=vx+ux*2.6,ky=vy+uy*2.6-.6,sp=(ux>=0?1:-1)*11;
    await Promise.all([
      tw(950,(e,u)=>{v.px=lerp(vx,kx,e);v.py=lerp(vy,ky,e);v.z=2.6*Math.sin(Math.PI*Math.min(1,u*.95));v.rot=u*sp;v.flash=Math.max(0,1-u*4);v.sx=v.sy=1-.55*u;v.alpha=u>.75?1-(u-.75)/.25:1;if(rand()<.4)spark(v.px,v.py,v.z+.3)},EA.lin),
      tw(380,e=>{a.lean=lerp(.14,0,e)},EA.out)
    ]);
  }else if(a.t==='B'){
    await tw(220,e=>{a.strike=-.5*e},EA.out);
    await tw(90,e=>{a.strike=-.5+1.5*e},EA.inn);
    v.mood='dead';v.tintCol='60,190,60';shake=.5;pop(vx,vy,'ҚАП!','#C8FF9E','#0F3A06');snd('hiss');bubbles(vx,vy,6);
    await tw(180,e=>{a.strike=1-.7*e;v.tint=e*.8;v.rot=.12*Math.sin(e*12)},EA.lin);
    await tw(900,(e,u)=>{v.sy=1-e;v.sx=1+.35*e;v.tint=.8;v.rot=Math.sin(u*40)*.08*(1-u);v.alpha=1-Math.max(0,(u-.7)/.3);if(rand()<.3)bubbles(vx,vy,1)},EA.inn);
    a.strike=0;
    await travel(a,vx,vy);
  }else if(a.t==='Q'){
    a.moving=true;snd('flap');
    const sx0=a.px,sy0=a.py,hx=vx-ux*.25,hy=vy-uy*.25;
    await tw(480,(e,u)=>{a.px=lerp(sx0,hx,e);a.py=lerp(sy0,hy,e);a.z=.95*e;a.wing=.5+.5*Math.sin(u*42)},EA.io);
    await wait(80);
    await tw(190,e=>{a.px=lerp(hx,vx,e);a.py=lerp(hy,vy,e);a.z=lerp(.95,.12,e);a.wing=lerp(1,.15,e);a.strike=e},EA.inn);
    v.mood='dead';v.flash=1;shake=.7;pop(vx,vy,'ШАП!');snd('screech');feathers(vx,vy,.4,7,col.main);puff(vx,vy,4);
    await tw(560,(e,u)=>{a.z=.12+1.0*e;a.wing=.5+.5*Math.sin(u*45);v.px=a.px;v.py=a.py;v.z=a.z-.18;v.sx=v.sy=1-.65*e;v.rot=Math.sin(u*30)*.25;v.alpha=1-Math.max(0,(u-.6)/.4);v.flash=Math.max(0,1-u*5);if(rand()<.15)feathers(a.px,a.py,a.z,1,PAL[a.c].main)},EA.io);
    await tw(340,e=>{a.z=1.12*(1-e);a.wing=.4*(1-e)+.1*Math.sin(e*20);a.strike=1-e},EA.out);
    a.moving=false;
  }else{ // king
    await tw(220,e=>{a.strike=-e;a.lean=-.06*e},EA.out);
    await wait(50);
    await tw(100,e=>{a.strike=-1+2*e;a.lean=-.06+.2*e},EA.inn);
    v.mood='dead';v.flash=1;shake=.8;pop(vx,vy,'ШАУ!');snd('sword');slash((ax+vx)/2+ux*.1,(ay+vy)/2,Math.atan2(dy,dx));puff(vx,vy,5);
    await tw(420,(e,u)=>{v.rot=1.5*e*a.face;v.flash=Math.max(0,1-u*4)},EA.inn);
    await Promise.all([tw(380,e=>{v.alpha=1-e},EA.lin),tw(260,e=>{a.strike=1-e;a.lean=.14*(1-e)},EA.out)]);
    puff(vx,vy,8,'#ffffff');
    await step(a,vx,vy,220);
  }
  a.px=vx;a.py=vy;
}

async function animateMove(m){
  const a=board[m.f],v=board[m.t],tx=m.t&7,ty=m.t>>3;
  if(v){
    const big=!REDUCE&&(v.t==='Q'||v.t==='K'||v.t==='R');
    if(big){slowF=1.6;stage.classList.add('cine')}
    try{await capture(a,v,m)}finally{slowF=1;stage.classList.remove('cine')}
  }else await travel(a,tx,ty);
  a.mood='idle';
  if(m.promo){
    a.t='Q';rest2(a);snd('promo');
    pop(tx,ty,'БҮРКІТ!','#FFF2A8');feathers(tx,ty,.4,8,PAL[a.c].main);for(let i=0;i<6;i++)spark(tx,ty,.5);
    await tw(420,(e,u)=>{a.z=.25*Math.sin(Math.PI*u);a.wing=.6*Math.sin(Math.PI*u)},EA.lin);
  }
}
function rest2(a){a.z=0;a.sx=1;a.sy=1;a.rot=0;a.strike=0;a.lean=0;a.wing=0;a.rear=0;a.tint=0;a.flash=0}

function setStatus(txt,c){

function afterMove(silent){

    try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.6;master.connect(ac.destination);
      nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){return null}

function tone(f,dur,o){
  const a=actx();if(!a)return;o=o||{};
  const t=a.currentTime+(o.delay||0),osc=a.createOscillator(),g=a.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
  if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,f*o.slide),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.25,t+(o.att||.006));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+dur+.03);
}
function noise(dur,o){
  const a=actx();if(!a)return;o=o||{};
  const t=a.currentTime+(o.delay||0),src=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();
  src.buffer=nbuf;src.loop=true;

  src.connect(fl);fl.connect(g);g.connect(master);src.start(t);src.stop(t+dur+.03);
}

  if(busy||over||!canAct())return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*S,y=(e.clientY-r.top)/r.height*S;
  let c=Math.floor((x-pad)/T),rr=Math.floor((y-pad)/T);
  if(c<0||c>7||rr<0||rr>7){sel=-1;selMoves=[];setHint(null);return}
  c=fx(c);rr=fx(rr);
  const i=rr*8+c;
  const mv=selMoves.find(m=>m.t===i);
  if(mv){humanMove(mv);return}
  const p=board[i];
  if(p&&p.c===turn){
    sel=i;selMoves=allMoves.filter(m=>m.f===i);setHint(p);snd('select');
  }else{sel=-1;selMoves=[];setHint(null)}
});
$('#sndBtn').addEventListener('click',()=>setMuted(!muted));
setMuted(muted);


/* ---------- emotes + spectating ---------- */
const EMO=['Сәлем! 👋','Жақсы жүріс! 👏','Қиын екен 😮','Асықпа 😏','Қателестім 🙈','Тағы ойнаймыз ба? 🤝','🔥','😂','👏','😱'];
function renderEmo(){
  const box=$('#emobar');
  const on=!!net&&net.mode==='pvp'&&net.status==='active'&&PL().isIn();
  box.hidden=!on;
  const key=on?(net.you?'p':'v'):'';
  if(!on||box.dataset.k===key+net.id)return;
  box.dataset.k=key+net.id;box.textContent='';
  EMO.forEach((t,i)=>{
    if(i<6&&!net.you)return;
    const b=el('button','emo'+(i>=6?' big':''),t);b.type='button';
    b.onclick=async()=>{
      if(b.disabled)return;b.disabled=true;setTimeout(()=>b.disabled=false,1200);
      const n=net;if(!n)return;
      const r=await napi({action:'emote',id:n.id,e:i});
      if(!r.ok)PL().toast('💬',r.error||'Жіберілмеді');
      else if(net===n)pollOnce();
    };
    box.append(b);
  });
}
function showEmote(c){
  const st=$('#stage');if(!st||c.e==null||!EMO[c.e])return;
  const mine=net&&net.you?c.s===net.you:c.s==='w';
  const txt=EMO[c.e];
  if(c.e>=6){
    const d=el('div','efly',txt);d.style.left=(8+Math.random()*80)+'%';
    if(c.u){const u=el('small','',c.u);d.append(u)}
    st.append(d);setTimeout(()=>d.remove(),2400);
  }else{
    const d=el('div','ebub '+(mine?'me':'op'),txt);
    st.append(d);setTimeout(()=>d.remove(),3800);
    snd('select');
  }
}
async function watchMatch(id){
  const r=await napi(null,'?id='+encodeURIComponent(id));
  const m=r.match;
  if(!m||m.status==='open'){PL().toast('⚠️','Ойын табылмады');return}
  if(m.status==='done'){startReplay(m.moves,m);return}
  if(net&&net.you&&net.status==='active'){PL().toast('♟️','Алдымен өз ойыныңды аяқта');return}
  setMode('net',true);
  adoptNet(m);net.you=null;
  hideLobby();resetLocal();setFlip(false);restoreFromMoves(m.moves);net.applied=m.moves.length;
  renderBars();refreshUI();startPoll();
  setStatus('Бақылаушы · '+NAME[turn]+' жүрісі',turn);
  PL().toast('👁️','Тікелей көріп отырсың','Реакция жібере аласың');
}
async function loadLive(card){
  const r=await PL().api('match?live=1');
  if(!r.live||!r.live.length)return;
  const h=el('h4','','🔴 Тікелей ойындар');card.append(h);
  for(const g of r.live){
    const b=el('button','btn ghost live',(g.wn||'?')+' ⚔ '+(g.bn||'?')+' · '+g.plies+' жүріс');
    b.onclick=()=>watchMatch(g.id);card.append(b);
  }
}

/* ---------- replay + share ---------- */
const gameMoves=()=>net&&net.moves?net.moves.slice():locLog.slice();
function rpShow(){
  const n=rp.moves.length;
  $('#rpBar').max=n;$('#rpBar').value=rp.k;
  $('#rpTxt').textContent=rp.k+' / '+n+' жүріс';
  $('#rpPlay').textContent=rp.auto?'⏸':'▶';
}
function rpBars(){
  if(!rp.white)return;
  const keep=net;net=null;
  fillBar($('#pbTop'),rp.black,'b');fillBar($('#pbBot'),rp.white,'w');
  net=keep;
}
async function rpSeek(k){
  rp.auto=false;rp.run++;
  k=Math.max(0,Math.min(rp.moves.length,k));
  restoreFromMoves(rp.moves.slice(0,k));
  rp.k=k;if(k===rp.moves.length&&rp.moves.length)document.body.classList.add('finale');
  $('#result').hidden=true;rpShow();
}
async function rpNext(){
  if(rp.k>=rp.moves.length||busy)return false;
  const run=rp.run,m=dec(rp.moves[rp.k]);
  await playMove(m,true);
  if(!rp||run!==rp.run)return false;
  rp.k++;rpShow();return true;
}
async function rpPlay(){
  if(rp.auto){rp.auto=false;rpShow();return}
  if(rp.k>=rp.moves.length)await rpSeek(0);
  rp.auto=true;rpShow();const run=rp.run;
  while(rp&&rp.auto&&run===rp.run){
    if(!await rpNext())break;
    await wait(350);
  }
  if(rp&&run===rp.run){rp.auto=false;rpShow()}
}
function startReplay(moves,info){
  clearTimeout(pollT);
  if(net&&net.mode==='pvp'&&net.status==='active')return;
  rp={moves,k:0,auto:false,run:0,white:info&&info.white,black:info&&info.black,id:info&&info.id};
  mode='replay';net=null;setFlip(false);
  ['mAi','mNet','mTwo'].forEach(i=>$('#'+i).setAttribute('aria-pressed','false'));
  resetLocal();hideLobby();
  $('#result').hidden=true;$('#rpanel').hidden=false;$('#lvlSeg').hidden=true;
  rp.run=0;rpBars();rpShow();
  setStatus('Қайта көру','w');
  rpPlay();
}
function exitReplay(){
  rp=null;$('#rpanel').hidden=true;$('#pbTop').hidden=$('#pbBot').hidden=true;
  setMode('ai');
}
$('#rpFirst').addEventListener('click',()=>rpSeek(0));
$('#rpPrev').addEventListener('click',()=>rpSeek(rp.k-1));
$('#rpNext').addEventListener('click',async()=>{rp.auto=false;await rpNext()});
$('#rpLast').addEventListener('click',()=>rpSeek(rp.moves.length));
$('#rpPlay').addEventListener('click',rpPlay);
$('#rpBar').addEventListener('input',e=>rpSeek(+e.target.value));
$('#rpExit').addEventListener('click',exitReplay);
$('#resRep').addEventListener('click',()=>{
  const mv=gameMoves();if(!mv.length)return;
  startReplay(mv,net?{white:net.white,black:net.black,id:net.id}:{white:{name:'Күн'},black:{name:'Түн'}});
});

/* share card (PNG) */
function shareCard(){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const dark=!!winner&&winner==='b';
  const g=x.createLinearGradient(0,0,0,H);
  if(dark){g.addColorStop(0,'#141a4a');g.addColorStop(1,'#2a3280')}else{g.addColorStop(0,'#ffe9a8');g.addColorStop(1,'#9bd16a')}
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=dark?'rgba(255,255,255,.9)':'#3b2705';x.textAlign='center';
  x.font='800 64px Unbounded, Nunito, system-ui, sans-serif';x.fillText('Жайлау Шайқасы',W/2,110);
  const wn=rp?(rp.white&&rp.white.name):(net&&net.white?net.white.name:'Күн'),bn=rp?(rp.black&&rp.black.name):(net&&net.black?net.black.name:'Түн');
  x.font='700 40px Nunito, system-ui, sans-serif';
  x.fillText((wn||'Күн')+'  ⚔  '+(bn||'Түн'),W/2,185);
  const sz=900;x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=40;x.shadowOffsetY=16;
  x.drawImage(cv,90,230,sz,sz);x.restore();
  x.font='800 56px Unbounded, Nunito, system-ui, sans-serif';
  const t=winner?NAME[winner]+' жағы жеңді! '+(winner==='w'?'☀️':'🌙'):'Тең ойын';
  x.fillText(t,W/2,1240);
  x.font='600 34px Nunito, system-ui, sans-serif';x.globalAlpha=.8;
  x.fillText(location.host,W/2,1305);
  return c;
}
async function shareGame(){
  const url=location.origin+((rp&&rp.id)||(net&&net.id)?'/?replay='+((rp&&rp.id)||net.id):'');
  const text=winner?'Жайлау Шайқасы: '+NAME[winner]+' жағы жеңді! Ойынды қарап көр:':'Жайлау Шайқасы ойыны:';
  let blob=null;
  try{blob=await new Promise(r=>shareCard().toBlob(r,'image/png'))}catch(e){}
  try{
    if(blob&&navigator.canShare&&navigator.canShare({files:[new File([blob],'zhailau.png',{type:'image/png'})]})){
      await navigator.share({files:[new File([blob],'zhailau.png',{type:'image/png'})],text,url});return;
    }
    if(navigator.share){await navigator.share({text,url});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);PL().toast('🔗','Сілтеме көшірілді',url)}catch(e){PL().toast('🔗',url)}
  if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zhailau.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
}
$('#resShare').addEventListener('click',shareGame);
$('#rpShare').addEventListener('click',shareGame);

function setMode(m,quiet){
  if(rp){rp=null;$('#rpanel').hidden=true;$('#pbTop').hidden=$('#pbBot').hidden=true}
  if(net&&net.you&&net.mode==='pvp'&&net.status==='active'&&m!=='net'){PL().toast('♟️','Алдымен онлайн ойынды аяқта','«Берілу» батырмасы бар');return}
  if(net&&net.mode==='pvp'&&net.status==='open'&&m!=='net'){napi({action:'cancel',id:net.id});net=null;clearTimeout(pollT)}
  if(net&&net.mode==='ai'&&m!=='ai')net=null;
  mode=m;
  $('#mAi').setAttribute('aria-pressed',m==='ai');
  $('#mNet').setAttribute('aria-pressed',m==='net');
  $('#mTwo').setAttribute('aria-pressed',m==='two');
  if(quiet){refreshUI();return}
  if(m==='net'){
    if(net&&net.mode==='pvp'){refreshUI();return}
    net=null;resetLocal();setFlip(false);renderBars();showLobby('menu');refreshUI();
  }else newGame();
}
$('#mAi').addEventListener('click',()=>setMode('ai'));
$('#mNet').addEventListener('click',()=>setMode('net'));
$('#mTwo').addEventListener('click',()=>setMode('two'));
$('#bNew').addEventListener('click',newGame);
$('#bUndo').addEventListener('click',undo);
$('#resBtn').addEventListener('click',()=>{if(mode==='net')newGame();else newGame()});
$('#lvlSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  lvl=+b.dataset.l;try{localStorage.setItem('lvl',lvl)}catch(x){}
  refreshUI();
  if(net&&net.mode==='ai'&&net.status==='active')PL().toast('🎚️','Деңгей келесі ойыннан бастап өзгереді');
});
let resArmed=0;
$('#bResign').addEventListener('click',async e=>{
  const b=e.currentTarget;
  if(!resArmed){resArmed=setTimeout(()=>{resArmed=0;b.textContent='Берілу'},3000);b.textContent='Растау?';return}
  clearTimeout(resArmed);resArmed=0;b.textContent='Берілу';
  const n=net;if(!n)return;
  const r=await napi({action:'resign',id:n.id});
  if(net===n&&r.match)netApply(r.match);
  else if(!r.ok)PL().toast('⚠️',r.error||'Қате');
});
$('#bClaim').addEventListener('click',async()=>{
  const n=net;if(!n)return;
  const r=await napi({action:'claim',id:n.id});
  if(net===n&&r.match)netApply(r.match);else PL().toast('⏳',r.error||'Әзірге күтіңіз');
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&net&&net.mode==='pvp')startPoll()});

/* ---------- character cards ---------- */
for(const t of ['K','Q','R','B','N','P']){
  const d=document.createElement('div');d.className='card';
  const k=document.createElement('canvas');k.className='ico';
  const w=document.createElement('div');
  const b=document.createElement('b');b.textContent=INFO[t].name;
  const s=document.createElement('div');s.className='say';s.textContent=INFO[t].say;
  const l=document.createElement('div');l.className='long';l.textContent=INFO[t].long;
  w.append(b,s,l);d.append(k,w);$('#cards').appendChild(d);
  icons.push({cv:k,t,c:'w'});
}

window.__icon=(cvs,t,c)=>drawIcon(cvs,t,c,0);
async function startup(){
  refreshUI();
  const P=PL();
  await P.ready;
  const qp=new URLSearchParams(location.search),jp=qp.get('join'),rid=qp.get('replay'),wid=qp.get('watch');
  let resumed=false;
  if(P.isIn()){
    const r=await napi(null,'?active=1');
    if(r.match&&r.match.status!=='done'){
      const m=r.match;
      mode=m.mode==='ai'?'ai':'net';
      $('#mAi').setAttribute('aria-pressed',mode==='ai');$('#mNet').setAttribute('aria-pressed',mode==='net');
      adoptNet(m);setFlip(net.you==='b');
      if(m.status==='active'){restoreFromMoves(m.moves);net.applied=m.moves.length;hideLobby()}
      else{net.public=true;showLobby('wait')}
      renderBars();refreshUI();startPoll();resumed=true;
      P.toast('♟️','Ойын жалғасты','Тоқтаған жерден жалғастырдық');
    }
  }
  if(!resumed)await newGame();
  if(jp){
    history.replaceState(null,'',location.pathname);
    if(P.isIn())joinCode(jp);else{P.toast('🔑','Ойынға қосылу үшін кіріңіз');P.login();const once=()=>{if(P.isIn()){joinCode(jp)}};P.onAuth(once,true)}
  }
  if(wid){history.replaceState(null,'',location.pathname);await watchMatch(wid)}
  if(rid){
    history.replaceState(null,'',location.pathname);
    const r=await napi(null,'?id='+encodeURIComponent(rid));
    if(r.match&&r.match.moves&&r.match.moves.length&&r.match.status==='done')startReplay(r.match.moves,r.match);
    else P.toast('⚠️','Ойын табылмады немесе әлі аяқталмаған');
  }
  P.onAuth(st=>{
    if(st==='out'){if(net&&net.mode==='pvp')clearTimeout(pollT);net=null;if(mode==='net'){resetLocal();setFlip(false);showLobby('menu')}else newGame();renderBars();refreshUI()}
    else if(st==='in'){if(mode==='ai'&&!net&&!busy&&!hist.length)newGame();else if(mode==='net'&&!net)showLobby('menu')}
  });
}
/* ---------- start ---------- */
new ResizeObserver(layout).observe(stage);
layout();
resetLocal();
startup();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildBoard()});
requestAnimationFrame(frame);
})();
